# Laragon Apache reverse proxy for the Cellphone Repair app.
#
# dev-up.ps1 writes an equivalent file to
#   <Laragon>\etc\apache2\sites-enabled\cp-repair-mgnt-app.conf
# and adds "127.0.0.1  cp-repair-mgnt-app" to the Windows hosts file, so a
# non-technical user can just open  http://cp-repair-mgnt-app/  in a browser.
#
# Drop this in that sites-enabled folder by hand if you'd rather not run the
# script. Requires mod_proxy / mod_proxy_http / mod_proxy_wstunnel (bundled
# with Laragon's Apache; the LoadModule lines below enable them).
#
#   http://cp-repair-mgnt-app/        -> Next.js  (127.0.0.1:3000)
#   http://cp-repair-mgnt-app/api/... -> Laravel  (127.0.0.1:8000)

<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !proxy_wstunnel_module>
    LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
</IfModule>

<VirtualHost *:80>
    ServerName cp-repair-mgnt-app
    ProxyPreserveHost On
    ProxyRequests Off

    # Laravel API - must precede the catch-all below
    ProxyPass         /api  http://127.0.0.1:8000/api  timeout=120
    ProxyPassReverse  /api  http://127.0.0.1:8000/api

    # Next.js dev hot-reload websocket (inert for a production build)
    ProxyPass         /_next/webpack-hmr  ws://127.0.0.1:3000/_next/webpack-hmr

    # Next.js app - everything else
    ProxyPass         /  http://127.0.0.1:3000/  timeout=120
    ProxyPassReverse  /  http://127.0.0.1:3000/
</VirtualHost>
